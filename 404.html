<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 | Stackly Nutrition Centre</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<style>
  .err{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;padding:110px 0 70px;text-align:center;
  }
  .err__bg{position:absolute;inset:0;z-index:-1}
  .err__blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
  .err__blob--1{width:480px;height:480px;background:rgba(163,230,53,.55);top:-140px;left:-100px;animation:float1 13s ease-in-out infinite}
  .err__blob--2{width:420px;height:420px;background:rgba(249,115,22,.28);bottom:-140px;right:-80px;animation:float2 15s ease-in-out infinite}
  .err__grid{
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(22,163,74,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(22,163,74,.06) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 30%,transparent 78%);
    mask-image:radial-gradient(ellipse at 50% 45%,#000 30%,transparent 78%);
  }
  .err__inner{width:min(100% - 40px,760px);margin-inline:auto}
  .err__logo{display:inline-flex;align-items:center;gap:11px;margin-bottom:34px}
  .err__num{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
    font-size:clamp(6rem,22vw,13rem);line-height:.9;letter-spacing:.02em;
    background:linear-gradient(120deg,var(--green),var(--lime) 55%,var(--orange));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:glitchIn .9s var(--ease) both;
  }
  @keyframes glitchIn{
    0%{opacity:0;transform:translateY(40px) skewY(4deg)}
    60%{opacity:1;transform:translateY(-8px) skewY(-1deg)}
    100%{opacity:1;transform:none}
  }
  .err__title{
    font-family:'Barlow Condensed',sans-serif;font-size:clamp(1.6rem,4vw,2.6rem);
    text-transform:uppercase;margin:16px 0 12px;
  }
  .err__text{color:var(--muted);max-width:520px;margin:0 auto 32px;animation:fadeUp .8s .3s var(--ease) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  .err__btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:fadeUp .8s .45s var(--ease) both}
  .err__plate{
    position:absolute;width:190px;height:190px;border-radius:50%;
    border:14px solid #fff;box-shadow:var(--shadow);overflow:hidden;
    top:16%;right:9%;animation:bob 6s ease-in-out infinite;display:none;
  }
  .err__plate img{width:100%;height:100%;object-fit:cover}
  @media (min-width:1100px){.err__plate{display:block}}
  .err__plate--2{top:auto;bottom:14%;right:auto;left:8%;width:130px;height:130px;animation-delay:1.2s;border-width:10px}
</style>
</head>
<body>

<!-- ================= PRELOADER ================= -->
<div class="preloader" id="preloader">
  <div class="preloader__ring"></div>
  <span class="preloader__text">STACKLY</span>
</div>

<!-- ================= HEADER ================= -->
<!-- ================= 404 ================= -->
<section class="err">
  <div class="err__bg">
    <div class="err__blob err__blob--1"></div>
    <div class="err__blob err__blob--2"></div>
    <div class="err__grid"></div>
  </div>

  <div class="err__plate">
    <img src="images/hero.webp" alt="Healthy food bowl">
  </div>
  <div class="err__plate err__plate--2">
    <img src="images/about-1.webp" alt="Fresh salad">
  </div>

  <div class="err__inner">
    <div class="err__num">404</div>
    <h1 class="err__title">This Plate Is <span class="gradient-text">Empty</span></h1>
    <p class="err__text">
      The page you're looking for has been eaten or moved. Let's get you back to
      something nutritious.
    </p>

    <div class="err__btns">
      <a href="index.html" class="btn btn--primary">Back To Home</a>
      <button type="button" class="btn btn--ghost" id="goBack">&#8592; Go Back</button>
    </div>

  </div>
</section>

<!-- ================= BACK TO TOP ================= -->
<button class="to-top" id="toTop" aria-label="Back to top">&#8593;</button>

<script src="script.js"></script>
</body>
</html>
